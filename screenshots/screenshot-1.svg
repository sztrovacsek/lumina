<svg viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="800" fill="#141B34"/>
  <rect x="20" y="40" width="360" height="720" fill="#0B1020" rx="40"/>
  
  <!-- Phone notch -->
  <rect x="150" y="20" width="100" height="30" fill="#0B1020" rx="20"/>
  
  <!-- Screen content -->
  <text x="200" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#8B5CF6">
    Lumina Quest
  </text>
  
  <!-- XP Display -->
  <rect x="40" y="200" width="320" height="80" fill="#8B5CF6" fill-opacity="0.2" rx="16"/>
  <text x="200" y="230" text-anchor="middle" font-size="16" fill="#E0E7FF">
    Mai XP
  </text>
  <text x="200" y="260" text-anchor="middle" font-size="32" font-weight="bold" fill="#C4B5FD">
    +450 XP
  </text>
  
  <!-- Mission Card -->
  <rect x="40" y="310" width="320" height="100" fill="#8B5CF6" fill-opacity="0.1" rx="16" stroke="#8B5CF6" stroke-width="2"/>
  <text x="60" y="340" font-size="14" fill="#A5F3FC">
    🎯 Napi küldetés
  </text>
  <text x="60" y="365" font-size="18" font-weight="bold" fill="#FFFFFF">
    Másodfokú egyenletek
  </text>
  <text x="60" y="390" font-size="12" fill="#B0B0B0">
    Progress: 72%
  </text>
  
  <!-- Bottom Menu -->
  <rect x="20" y="700" width="360" height="60" fill="#1F2941" rx="20"/>
  <text x="80" y="740" text-anchor="middle" font-size="24">📚</text>
  <text x="200" y="740" text-anchor="middle" font-size="24">⚡</text>
  <text x="320" y="740" text-anchor="middle" font-size="24">👤</text>
</svg>
