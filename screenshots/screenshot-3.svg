  </text>
  
  <!-- Achievement Grid -->
  <rect x="40" y="200" width="160" height="160" fill="#22C55E" fill-opacity="0.2" rx="16" stroke="#22C55E" stroke-width="2"/>
  <text x="120" y="270" text-anchor="middle" font-size="48">🔥</text>
  <text x="120" y="300" text-anchor="middle" font-size="12" fill="#FFFFFF">
