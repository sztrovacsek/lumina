  </text>
  
  <rect x="220" y="380" width="160" height="160" fill="#06B6D4" fill-opacity="0.2" rx="16" stroke="#06B6D4" stroke-width="2"/>
  <text x="300" y="450" text-anchor="middle" font-size="48">🎯</text>
  <text x="300" y="480" text-anchor="middle" font-size="12" fill="#FFFFFF">
