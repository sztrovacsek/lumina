  </text>
  <text x="120" y="315" text-anchor="middle" font-size="12" fill="#FFFFFF">
    streak
  </text>
  
  <rect x="220" y="200" width="160" height="160" fill="#8B5CF6" fill-opacity="0.2" rx="16" stroke="#8B5CF6" stroke-width="2"/>
  <text x="300" y="270" text-anchor="middle" font-size="48">⭐</text>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#FFFFFF">
