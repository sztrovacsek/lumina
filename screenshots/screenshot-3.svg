  </text>
  <text x="300" y="495" text-anchor="middle" font-size="12" fill="#FFFFFF">
    teljesítve
  </text>
  
  <!-- Bottom Menu -->
  <rect x="20" y="700" width="360" height="60" fill="#1F2941" rx="20"/>
  <text x="80" y="740" text-anchor="middle" font-size="24">📚</text>
  <text x="200" y="740" text-anchor="middle" font-size="24">⚡</text>
  <text x="320" y="740" text-anchor="middle" font-size="24">👤</text>
